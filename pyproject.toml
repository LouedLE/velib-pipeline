[project]
name = "velib-pipeline"
version = "0.1.0"
description = "Pipeline de données Vélib Métropole : collecte GBFS, dbt + DuckDB, dashboard Streamlit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pandas>=2.2",
    "pyarrow>=16",
    "duckdb>=1.1",
    "dbt-core>=1.10,<2",
    "dbt-duckdb>=1.9",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.40", "altair>=5"]

[project.scripts]
velib-ingest = "velib_pipeline.ingest:main"
velib-demo = "velib_pipeline.demo:main"
velib-export = "velib_pipeline.export_gold:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/velib_pipeline"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
