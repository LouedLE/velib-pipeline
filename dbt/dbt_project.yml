name: velib
version: "1.0.0"
config-version: 2
profile: velib

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Au-delà de ce délai, une remontée de station est jugée périmée
  stale_after_minutes: 60

models:
  velib:
    silver:
      +schema: silver
      +materialized: table
    gold:
      +schema: gold
      +materialized: table
