name: Collecte horaire

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer l'historique depuis la branche data
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin data; then
            git clone --quiet --depth 1 --branch data \
              "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" previous
            cp -r previous/bronze data/
          fi

      - uses: astral-sh/setup-uv@v5
      - run: uv sync

      - name: Collecter un instantané
        run: uv run velib-ingest

      - name: Transformations et tests dbt
        run: cd dbt && uv run dbt build --profiles-dir .

      - name: Export gold
        run: uv run velib-export

      - name: Publier sur la branche data
        # Un seul commit écrasé à chaque collecte : l'historique Git ne grossit pas,
        # et ces commits automatiques n'apparaissent pas comme des contributions personnelles.
        run: |
          mkdir publish
          cp -r data/bronze data/gold publish/
          cd publish
          git init --quiet --initial-branch data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit --quiet -m "data: collecte $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force --quiet \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
